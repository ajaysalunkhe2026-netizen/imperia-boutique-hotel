name: Website and platform CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imperia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imperia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/imperia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Export resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prepare disposable Supabase Auth schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY);"
      - name: Apply database migrations
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run database integrity and RLS tests
        run: |
          for test_file in database/tests/*.sql; do
            echo "Running $test_file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$test_file"
          done
      - name: Production build
        run: npm run build
